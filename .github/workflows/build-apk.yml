name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Python tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Check embedded TAC database
        run: |
          test -s data/tac.sqlite
          python -c "import sqlite3; print(sqlite3.connect('data/tac.sqlite').execute('select count(*) from tac').fetchone()[0], 'TACs')"

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: g2-imei-generator-apk
          path: bin/*.apk
