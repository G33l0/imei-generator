name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# All actions below run on Node.js 24 (Node 20 is deprecated on GitHub runners).
#
# The Android jobs are pinned to Ubuntu 24.04, the platform python-for-android
# and Buildozer are tested on. `ubuntu-latest` now points to Ubuntu 26.04;
# switch the runs-on lines to `ubuntu-latest` / `ubuntu-26.04` to build there
# (the package list below also covers 26.04).

env:
  # Packages python-for-android needs on the build machine. libltdl-dev
  # provides the LT_SYS_SYMBOL_USCORE autoconf macro; without it the libffi
  # recipe fails with "possibly undefined macro: LT_SYS_SYMBOL_USCORE".
  APT_PACKAGES: >-
    build-essential git zip unzip autoconf automake libtool libltdl-dev
    pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  apk:
    # Debug APK for every push / PR; tags build the signed release below instead.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Python tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3"

      - name: Cache Buildozer
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Check embedded TAC database
        run: |
          test -s data/tac.sqlite
          python -c "import sqlite3; print(sqlite3.connect('data/tac.sqlite').execute('select count(*) from tac').fetchone()[0], 'TACs')"

      - name: Build debug APK
        # SDK licences are accepted via android.accept_sdk_license in buildozer.spec.
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v6
        with:
          name: g2-imei-generator-apk
          path: bin/*.apk
          if-no-files-found: error

  release:
    # Push a tag like v1.3.0 to build a signed APK and publish a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Python tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3"

      - name: Cache Buildozer
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Set app version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = ${VERSION}/" buildozer.spec
          grep '^version' buildozer.spec

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD (see README: Signed releases)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "P4A_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: buildozer -v android release

      - name: Verify signature and checksum
        run: |
          APK=$(ls bin/*-release*.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          (cd bin && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/*-release*.apk
            bin/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
